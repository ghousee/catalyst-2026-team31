es while audit capacity is above 60% and still rising.", "call": "Run TMFCOM STATUS TRANSACTION and find the settlement batch (SETTLE-SC) transaction that is hours old. Identify the pinning transaction before you add any overflow volume."}}, {"id": "maria:h11", "label": "maria:h11", "kind": "heuristic", "color": "#f59e0b", "info": {"owner": "maria", "status": "approved", "type": "note", "scope": "node:PROD / rvu:L / sub:TMF", "captured_via": "incident", "when": "Audit trail is out of space on \\PROD at quarter-end and the manual points you at raising FILESPERVOLUME first (the \"recommended approach\").", "call": "Do not start with FILESPERVOLUME. First find and resolve the transaction pinning the oldest audit file. Add an overflow volume only as a bridge, and only after the pinning transaction is identified."}}, {"id": "maria:h12", "label": "maria:h12", "kind": "heuristic", "color": "#f59e0b", "info": {"owner": "maria", "status": "approved", "type": "note", "scope": "node:PROD / rvu:L / sub:TMF", "captured_via": "interview", "when": "The pinning transaction is the settlement batch and audit capacity has passed 70%.", "call": "Abort it early with TMFCOM ABORT TRANSACTION (second approver) and let SETTLE-SC retry the batch. Do not wait for the batch to finish."}}, {"id": "maria:h3", "label": "maria:h3", "kind": "heuristic", "color": "#f59e0b", "info": {"owner": "maria", "status": "approved", "type": "note", "scope": "node:PROD / rvu:L / sub:TMF", "captured_via": "interview", "when": "You are about to ABORT TRANSACTION on the oldest active transaction at quarter-end.", "call": "Read the owner process in STATUS TRANSACTION first. If it belongs to the settlement batch, tell Batch Operations before you abort: the abort backs out the whole batch and they have to re-run it."}}, {"id": "raj:h3", "label": "raj:h3", "kind": "heuristic", "color": "#f59e0b", "info": {"owner": "raj", "status": "approved", "type": "note", "scope": "node:PROD / rvu:L / sub:PATHWAY", "captured_via": "referral", "when": "An old transaction is pinning the audit trail on \\PROD and you need to know which Pathway server class owns it.", "call": "Run PATHCOM STATUS TERM and match the TRANS-ID to the TMFCOM STATUS TRANSACTION list. If it belongs to SETTLE-SC it is the batch; ATM-SC and POS-SC transactions only last seconds."}}, {"id": "raj:h4", "label": "raj:h4", "kind": "heuristic", "color": "#f59e0b", "info": {"owner": "raj", "status": "approved", "type": "note", "scope": "node:PROD / rvu:L / sub:PATHWAY", "captured_via": "referral", "when": "Pathway 1034 (no server available): a server class is at its MAXSERVERS and requests are queueing.", "call": "Raise MAXSERVERS carefully, two at a time, and check that the total of MAXSERVERS over all classes stays below MAXSERVERPROCESSES. Leave LINKDEPTH at 1."}}, {"id": "raj:h6", "label": "raj:h6", "kind": "heuristic", "color": "#f59e0b", "info": {"owner": "raj", "status": "approved", "type": "note", "scope": "node:PROD / rvu:L / sub:TMF", "captured_via": "referral", "when": "The settlement transaction is pinning the audit trail and capacity is above 85%.", "call": "Do not abort it yet. Add an overflow volume first to buy headroom, then let the batch finish or abort it once capacity is back under 80%."}}, {"id": "raj:h8", "label": "raj:h8", "kind": "heuristic", "color": "#f59e0b", "info": {"owner": "raj", "status": "approved", "type": "note", "scope": "node:DR / rvu:L / sub:TMF", "captured_via": "interview", "when": "Audit trail capacity is climbing on \\DR (TMF 185 or 187 raised on the DR node).", "call": "Do not look for the settlement batch: it does not run on \\DR. Run TMFCOM STATUS TRANSACTION and look for long transactions started by the replication apply processes, and check the link to \\PROD before adding any volume."}}, {"id": "lena:h4", "label": "lena:h4", "kind": "heuristic", "color": "#f59e0b", "info": {"owner": "lena", "status": "approved", "type": "note", "scope": "node:PROD / rvu:L / sub:SCF-STORAGE", "captured_via": "interview", "when": "A disk flaps between UP and HARDDOWN after a path error (DISK 5015).", "call": "Check the cable and the CLIM on the failing path first (SCF STATUS DISK $vol, DETAIL shows which path). Replace the drive last."}}, {"id": "lena:h2", "label": "lena:h2", "kind": "heuristic", "color": "#f59e0b", "info": {"owner": "lena", "status": "approved", "type": "warning_pattern", "scope": "all nodes / rvu:L / sub:SCF-STORAGE", "captured_via": "interview", "when": "A mirror revive is running and Current Logical Sector in STATUS DISK, DETAIL has not moved across two checks ten minutes apart, while the revive interval keeps growing.", "call": "Do not start the revive again. Check EMS for checksum errors on the source mirror, then call storage on-call. The options are automatic sector reallocation or a controlled stop of the revive."}}, {"id": "doc:TMF-Reference:status-audittrail", "label": "STATUS AUDITTRAIL", "kind": "doc", "color": "#94a3b8", "info": {"id": "doc:TMF-Reference:status-audittrail", "section": "TMFCOM Commands > STATUS AUDITTRAIL (txt p.295)", "edition": "TMF Reference Manual, H-series edition (540138-001, July 2005)"}}, {"id": "doc:TMF-Reference:status-audittrail-output-displayed", "label": "STATUS AUDITTRAIL - Output Dis", "kind": "doc", "color": "#94a3b8", "info": {"id": "doc:TMF-Reference:status-audittrail-output-displayed", "section": "TMFCOM Commands > STATUS AUDITTRAIL - Output Displayed (txt p.297)", "edition": "TMF Reference Manual, H-series edition (540138-001, July 2005)"}}, {"id": "doc:SCF-Storage:stopping-a-revive-operation", "label": "Stopping a Revive Operation", "kind": "doc", "color": "#94a3b8", "info": {"id": "doc:SCF-Storage:stopping-a-revive-operation", "section": "Stopping a Revive Operation (txt p.100)", "edition": "SCF Reference Manual for the Storage Subsystem, J/H-series edition (529937-022, Feb 2014)"}}, {"id": "doc:TMF-Reference:status-transactions", "label": "STATUS TRANSACTIONS", "kind": "doc", "color": "#94a3
