  # ---------------- command catalog (templates; risk class decided here, never by the LLM) ----------------
  # props.source_id MUST be a real doc_chunk id documenting the command (loader validates).
  - id: 'cmd:tmfcom.status_tmf'
    kind: command
    name: TMFCOM STATUS TMF
    parent_id: 'sub:TMF'
    props: {template_id: tmfcom.status_tmf, command: 'TMFCOM STATUS TMF', risk: read_only, subsystem: 'sub:TMF',
            explanation: 'Shows TMF state, the audit trail, BEGINTRANS enablement and any out-of-audit-space warning.',
            source_id: 'doc:TMF-Reference:status-tmf'}
    aliases: [status tmf, tmf status, check tmf, is tmf running, tmf state]
  - id: 'cmd:tmfcom.status_audittrail_detail'
    kind: command
    name: TMFCOM STATUS AUDITTRAIL, DETAIL
    parent_id: 'sub:TMF'
    props: {template_id: tmfcom.status_audittrail_detail, command: 'TMFCOM STATUS AUDITTRAIL, DETAIL', risk: read_only, subsystem: 'sub:TMF',
            explanation: 'Shows capacity used, the first pinned file and why it is pinned, and every audit file on disk.',
            source_id: 'doc:TMF-Reference:status-audittrail'}
    aliases: [status audittrail, status audit trail, check audit trail, audit trail status, show audit trail, audit trail detail]
  - id: 'cmd:tmfcom.status_transaction'
    kind: command
    name: TMFCOM STATUS TRANSACTION
    parent_id: 'sub:TMF'
    props: {template_id: tmfcom.status_transaction, command: 'TMFCOM STATUS TRANSACTION', risk: read_only, subsystem: 'sub:TMF',
            explanation: 'Lists active transactions with identifier, state and owning process so the one pinning the audit trail can be found.',
            source_id: 'doc:TMF-Reference:status-transactions'}
    aliases: [status transaction, status transactions, list transactions, active transactions, long running transaction,
              long-running transaction, oldest transaction, find the transaction, stuck transaction, hung transaction]
  - id: 'cmd:tmfcom.status_begintrans'
    kind: command
    name: TMFCOM STATUS BEGINTRANS
    parent_id: 'sub:TMF'
    props: {template_id: tmfcom.status_begintrans, command: 'TMFCOM STATUS BEGINTRANS', risk: read_only, subsystem: 'sub:TMF',
            explanation: 'Reports whether BEGINTRANS is enabled and, if disabled, every reason why.',
            source_id: 'doc:TMF-Reference:status-begintrans'}
    aliases: [status begintrans, why is begintrans disabled, begintrans status]
  - id: 'cmd:tmfcom.abort_transaction'
    kind: command
    name: 'TMFCOM ABORT TRANSACTION \node(cpu).seq.num'
    parent_id: 'sub:TMF'
    props: {template_id: tmfcom.abort_transaction, command: 'TMFCOM ABORT TRANSACTION \node(cpu).seq.num', risk: critical, subsystem: 'sub:TMF',
            explanation: 'Backs out the named active transaction and releases its locks; it cannot be undone and the application must retry.',
            source_id: 'doc:TMF-Reference:abort-transaction'}
    aliases: [abort transaction, kill transaction, back out transaction, backout transaction, cancel transaction]
  - id: 'cmd:tmfcom.alter_audittrail_addoverflow'
    kind: command
    name: 'TMFCOM ALTER AUDITTRAIL MAT, ADDOVERFLOW $volume'
    parent_id: 'sub:TMF'
    props: {template_id: tmfcom.alter_audittrail_addoverflow, command: 'TMFCOM ALTER AUDITTRAIL MAT, ADDOVERFLOW $volume', risk: state_changing, subsystem: 'sub:TMF',
            explanation: 'Adds an overflow audit volume; the condition clears once the oldest pinned file is copied there. It does not remove the cause.',
            source_id: 'doc:TMF-Reference:status-audittrail-part-2'}
    aliases: [add overflow volume, add overflow, addoverflow, alter audittrail, add audit volume, increase filespervolume, filespervolume]
  - id: 'cmd:tmfcom.enable_begintrans'
    kind: command
    name: TMFCOM ENABLE BEGINTRANS
    parent_id: 'sub:TMF'
    props: {template_id: tmfcom.enable_begintrans, command: 'TMFCOM ENABLE BEGINTRANS', risk: state_changing, subsystem: 'sub:TMF',
            explanation: 'Resumes transaction processing (super user only); it disables itself again if the audit trail is still over its threshold.',
            source_id: 'doc:TMF-Reference:enable-auditdump-enable-begintrans'}
    aliases: [enable begintrans, turn transactions back on, resume transaction processing]
  - id: 'cmd:tmfcom.disable_begintrans'
    kind: command
    name: TMFCOM DISABLE BEGINTRANS
    parent_id: 'sub:TMF'
    props: {template_id: tmfcom.disable_begintrans, command: 'TMFCOM DISABLE BEGINTRANS', risk: critical, subsystem: 'sub:TMF',
            explanation: 'Suspends transaction processing by refusing new BEGINTRANSACTION calls; applications can fail.',
            source_id: 'doc:TMF-Reference:disable-begintrans'}
    aliases: [disable begintrans, stop new transactions, suspend transactions]
  - id: 'cmd:scf.status_disk_detail'
