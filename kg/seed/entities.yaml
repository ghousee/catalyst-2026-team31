    parent_id: 'sub:PATHWAY'
    props: {template_id: pathcom.thaw_server, command: 'PATHCOM THAW SERVER class', risk: state_changing, subsystem: 'sub:PATHWAY',
            explanation: 'Thaws a frozen server class so SENDs to it succeed again; pair with START SERVER if it was stopped.',
            source_id: 'doc:Pathway:procedure-for-synchronous-upgrade'}
