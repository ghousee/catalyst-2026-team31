            explanation: 'Starts the mirror half of a mirrored volume; a revive then copies data from the other half.',
            source_id: 'doc:SCF-Storage:start-disk-command'}
    aliases: [start disk, start mirror, bring mirror back, restart mirror, revive mirror, start the mirror]
  - id: 'cmd:scf.abort_disk'
