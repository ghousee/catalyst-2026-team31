    props: {template_id: fup.listopens, command: 'FUP LISTOPENS file', risk: read_only, subsystem: 'sub:FUP',
            explanation: 'Lists the processes that have a file open; use before touching a file you suspect is in use.',
            source_id: 'doc:FUP:listopens'}
