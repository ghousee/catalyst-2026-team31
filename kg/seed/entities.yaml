  - id: 'cmd:peek.cpu'
    kind: command
    name: 'PEEK /CPU n/'
    parent_id: 'sub:PEEK'
    props: {template_id: peek.cpu, command: 'PEEK /CPU n/', risk: read_only, subsystem: 'sub:PEEK',
