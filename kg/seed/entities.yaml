    parent_id: 'sub:SCF-STORAGE'
    props: {template_id: scf.abort_disk, command: 'SCF ABORT DISK $vol-M', risk: critical, subsystem: 'sub:SCF-STORAGE',
            explanation: 'Puts the disk path into STOPPED / HARDDOWN while leaving the disk process running; never on the system disk.',
            source_id: 'doc:SCF-Storage:abort-command'}
    aliases: [abort disk, hard down a disk, force disk down]
  - id: 'cmd:pathcom.status_tcp'
    kind: command
    name: PATHCOM STATUS TCP *
    parent_id: 'sub:PATHWAY'
    props: {template_id: pathcom.status_tcp, command: 'PATHCOM STATUS TCP *', risk: read_only, subsystem: 'sub:PATHWAY',
