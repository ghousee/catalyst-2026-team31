# Entities for the knowledge graph. ILLUSTRATIVE demo content (see README.md).
# alias_only: true  -> row already exists (created by the manual loader); only aliases are updated.
# Aliases are the shop-floor words operators actually type; matching is deterministic (see backend/graph/query.py):
# case-insensitive, punctuation/stop-words ignored, light stemming (fills = filling = fill).
# Bare event numbers are NOT aliases: they resolve through props.number + props.ems (so "185" and "TMF 185" both work).

entities:
  # ---------------- existing: subsystems (kind system) ----------------
  - {id: 'sub:TMF', kind: system, alias_only: true,
     aliases: [TMF, TMFCOM, transaction management facility, transaction manager, tmf subsystem, tmp, audit, auditing, transaction backout]}
  - {id: 'sub:PATHWAY', kind: system, alias_only: true,
     aliases: [Pathway, PATHCOM, TS/MP, TSMP, Pathway/iTS, server class, server classes, requester, SCREEN COBOL, scobol]}
  - {id: 'sub:SCF-STORAGE', kind: system, alias_only: true,
     aliases: [SCF, SCF storage, storage subsystem, storage, disk, disks, disk process, DP2, mirrored disk, volume, CLIM]}
  - {id: 'sub:TACL', kind: system, alias_only: true,
     aliases: [TACL, tacl prompt, command interpreter, STATUS command, process list]}
  - {id: 'sub:PEEK', kind: system, alias_only: true,
     aliases: [PEEK, peek utility, processor statistics, cpu statistics]}
  - {id: 'sub:MEASURE', kind: system, alias_only: true,
     aliases: [Measure, MEASCOM, measure counters, performance counters, performance measurement]}
  - {id: 'sub:FUP', kind: system, alias_only: true,
     aliases: [FUP, file utility program, file utility, file open, who has the file open]}

  # ---------------- existing: nodes (site) and series (version) ----------------
  - {id: 'node:PROD', kind: site, alias_only: true,
     aliases: ['\PROD', prod, prod node, production node, production system, primary node]}
  - {id: 'node:DR', kind: site, alias_only: true,
     aliases: ['\DR', dr, dr node, disaster recovery, disaster recovery site, backup site, standby node, failover site]}
  - {id: 'rvu:L', kind: version, alias_only: true, aliases: [L-series, L series, NonStop X, x86]}
  - {id: 'rvu:J', kind: version, alias_only: true, aliases: [J-series, J series, Itanium]}
  - {id: 'rvu:H', kind: version, alias_only: true, aliases: [H-series, H series]}

  # ---------------- events (EMS subsystem + number); numbers/meanings from the demo scenario ----------------
  - id: 'evt:TMF-185'
    kind: event
    name: 'TMF 185 - audit file pinned'
    parent_id: 'sub:TMF'
    props: {ems: TMF, number: 185, verified: false, severity: warning,
            note: 'Meaning from the demo scenario; the EMS Operator Messages manual is not in the corpus.'}
    aliases: [audit file pinned, pinned file, file pinned, audit trail pinned, audit trail file pinned,
              first pinned file, audit trail filling, audit trail filling up, audit trail fills up,
              audit trail growing, audit trail not releasing, audit files not being released, trail filling, trail filling up,
              audit volume filling, audit capacity rising, audit trail getting full]
  - id: 'evt:TMF-187'
    kind: event
    name: 'TMF 187 - audit trail critically full'
    parent_id: 'sub:TMF'
    props: {ems: TMF, number: 187, verified: false, severity: critical,
            note: 'Meaning from the demo scenario; see TMFCOM STATUS AUDITTRAIL for the documented out-of-space warning.'}
    aliases: [audit trail full, audit trail critically full, audit trail is full, trail full, audit trail out of space,
              out of audit trail space, out of audit space, audit space exhausted, TMF cannot proceed, audit trail exhausted,
              audit full, audit trail 100%]
  - id: 'evt:TMF-109'
    kind: event
    name: 'TMF 109 - BEGINTRANS disabled'
    parent_id: 'sub:TMF'
    props: {ems: TMF, number: 109, verified: false, severity: critical,
            note: 'Meaning from the demo scenario; BEGINTRANSDISABLE threshold behaviour is documented under ALTER AUDITTRAIL.'}
    aliases: [BEGINTRANS disabled, begintrans, cannot begin transactions, cant begin transactions, no new transactions,
              transactions suspended, transaction processing suspended, transactions stopped, new transactions rejected,
              transaction processing disabled, TMF disabled transactions, begintransaction failing]
  - id: 'evt:TMF-172'
    kind: event
    name: 'TMF 172 - audit trail using overflow volume'
    parent_id: 'sub:TMF'
    props: {ems: TMF, number: 172, verified: false, severity: warning,
            note: 'Meaning from the demo scenario; STATUS AUDITTRAIL documents OVERFLOW SPACE IN USE.'}
    aliases: [overflow space in use, overflow volume in use, using overflow, overflow threshold, passed overflow threshold,
              overflow audit volume, audit overflow, overflow]
  - id: 'evt:TMF-174'
    kind: event
    name: 'TMF 174 - audit trail rollover failed'
    parent_id: 'sub:TMF'
    props: {ems: TMF, number: 174, verified: false, severity: critical,
            note: 'Meaning from the demo scenario; STATUS TMF documents the out-of-audit-trail-space warning.'}
    aliases: [rollover failed, audit rollover failed, audit trail rollover, cannot roll over, no file for rollover,
              audit generation stopped, TMF stopped generating audit, cannot locate file for rollover]
  - id: 'evt:DISK-5015'
    kind: event
    name: 'DISK 5015 - disk path error'
    parent_id: 'sub:SCF-STORAGE'
    props: {ems: DISK, number: 5015, verified: false, severity: warning,
            note: 'Illustrative event number for a path error.'}
    aliases: [path error, path errors, disk path error, io path error, path flapping, path down, flapping disk,
              disk flapping, up and harddown, harddown, hard down, disk keeps going down, disk bouncing, primary path error]
  - id: 'evt:DISK-5032'
    kind: event
    name: 'DISK 5032 - mirror drive down'
    parent_id: 'sub:SCF-STORAGE'
    props: {ems: DISK, number: 5032, verified: false, severity: critical,
            note: 'Illustrative event number for a mirror half going down.'}
    aliases: [mirror down, mirror drive down, mirror is down, one half down, mirror half down, mirror failed, mirror lost,
              mirrored volume degraded, volume running unmirrored, single sided, lost a mirror, mirror not up]
  - id: 'evt:DISK-5034'
    kind: event
    name: 'DISK 5034 - revive stalled'
    parent_id: 'sub:SCF-STORAGE'
    props: {ems: DISK, number: 5034, verified: false, severity: warning,
            note: 'Illustrative event number; the stall symptoms are documented under stopping a revive operation.'}
    aliases: [revive stuck, revive stalled, revive hung, revive not progressing, revive not moving, revive taking forever,
              revive never finishes, revive loop, revive looping, revive slow, revive stopped moving, revive frozen,
              mirror revive stuck, mirror revive stalled, stalled revive, stuck revive]
  - id: 'evt:PATHWAY-1034'
    kind: event
    name: 'Pathway 1034 - no server available'
    parent_id: 'sub:PATHWAY'
    props: {ems: Pathway, number: 1034, verified: false, severity: warning,
            note: 'Illustrative; server class at MAXSERVERS with requests queueing.'}
    aliases: [no server available, no server, no servers available, server class saturated, server class busy, server class full,
              requests queueing, requests queuing, requests backing up, maxservers, max servers, server class at max,
              server class at maxservers, servers all busy, pathway error 1034]
  - id: 'evt:PATHWAY-1061'
    kind: event
    name: 'Pathway 1061 - server class frozen'
    parent_id: 'sub:PATHWAY'
    props: {ems: Pathway, number: 1061, verified: false, severity: warning,
            note: 'Illustrative; documented behaviour is the freeze-pending/frozen state rejecting SENDs.'}
    aliases: [server frozen, server class frozen, frozen server class, freeze pending, frozen state, server is frozen,
              send fails frozen, server class in freeze pending, stuck frozen, thaw]
  - id: 'evt:PATHWAY-1038'
    kind: event
    name: 'Pathway 1038 - server process limit reached'
    parent_id: 'sub:PATHWAY'
    props: {ems: Pathway, number: 1038, verified: false, severity: warning,
            note: 'Illustrative; documented message is NO SPACE FOR NEW SERVER PROCESS (MAXSERVERPROCESSES).'}
    aliases: [no space for new server process, maxserverprocesses, max server processes, server process limit,
              server process limit reached, cannot start more servers, too many server processes, link limit]
  - id: 'evt:CPU-101'
    kind: event
    name: 'CPU 101 - CPU down / backup takeover'
    parent_id: 'sub:PEEK'
    props: {ems: CPU, number: 101, verified: false, severity: critical,
            note: 'Illustrative event number; backup-takeover behaviour is described in the Pathway TCP messages.'}
    aliases: [cpu down, processor down, cpu halted, cpu failure, cpu failed, cpu crashed, lost a cpu, cpu halt, takeover,
              backup takeover, process pair takeover, backup took over, processor halted, cpu is down]

  # ---------------- objects ----------------
  - {id: 'obj:audit-trail-MAT', kind: object, name: 'Master audit trail (MAT)', parent_id: 'sub:TMF',
