services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kg
      POSTGRES_PASSWORD: kg
      POSTGRES_DB: kg
    # host port configurable so this can run next to other local Postgres stacks
    ports: ["${PG_PORT:-5432}:5432"]
    volumes:
      # named volume, not a ./pgdata bind mount: bind mounts on Docker Desktop for
      # Windows break Postgres file permissions/fsync
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  ollama:
    image: ollama/ollama:latest
    ports: ["${OLLAMA_PORT:-11434}:11434"]
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  ollama:
